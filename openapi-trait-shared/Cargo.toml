[package]
name = "openapi-trait-shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-agnostic codegen helpers for openapi-trait (not intended for direct use)"
readme = "README.md"
documentation = "https://docs.rs/openapi-trait-shared"
keywords.workspace = true
categories.workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
prettyplease = "0.2"
oas3 = "0.22"
# `preserve_order` keeps the document order of properties, which is the order
# of the generated struct fields.
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
yaml_serde = "0.10"
heck = "0.5"
indexmap = "2"

[features]
# When enabled, generated model types derive `serde_valid::Validate` and carry
# `#[validate(...)]` attributes reflecting the OpenAPI schema constraints. The
# facade crate re-exports `serde_valid`, but the derive's expansion refers to
# `::serde_valid` directly, so the user's crate must depend on it too; this
# flag only toggles what the codegen emits.
validation = []

[lints]
workspace = true
