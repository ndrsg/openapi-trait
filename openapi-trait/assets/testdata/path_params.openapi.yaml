# Regression fixture for path parameters.
openapi: 3.0.1
info:
  title: path params
  version: 0.0.1
paths:
  # Params declared in the reverse of their URL order.
  /swapped/{a}/{b}:
    get:
      operationId: getSwapped
      parameters:
        - { name: b, in: path, required: true, schema: { type: string } }
        - { name: a, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json: { schema: { type: string } }
  # Reversed, with differing types.
  /typed/{id}/{slug}:
    get:
      operationId: getTyped
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json: { schema: { type: string } }
  # A string-enum path parameter.
  /things/{kind}:
    get:
      operationId: getThing
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [a, b, "x-y"] } }
      responses:
        '200':
          description: ok
          content:
            application/json: { schema: { type: string } }
  # The same parameter at path-item and operation level; the operation wins.
  /dup/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDup
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json: { schema: { type: integer } }
  # A path parameter that refers to a component enum uses the component type.
  /shapes/{shape}:
    get:
      operationId: getShape
      parameters:
        - { name: shape, in: path, required: true, schema: { $ref: '#/components/schemas/Shape' } }
      responses:
        '200':
          description: ok
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shape' } }
  # A date-time path parameter must be sent in its RFC 3339 form.
  /at/{when}:
    get:
      operationId: getAt
      parameters:
        - { name: when, in: path, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: ok
          content:
            application/json: { schema: { type: string, format: date-time } }
components:
  schemas:
    Shape:
      type: string
      enum: [circle, "rounded-square"]
