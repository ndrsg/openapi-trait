# Hand-written fixture for ANALYSIS.md #2: operationIds and parameter names that
# collide with Rust keywords or need normalisation. The codegen must emit
# keyword-safe (raw) identifiers instead of panicking.
openapi: 3.0.1
info:
  title: awkward
  version: 0.0.1
paths:
  /things:
    get:
      # `type` is a Rust keyword -> method must be `r#type`, type `TypeRequest`.
      operationId: type
      parameters:
        # `type` is a keyword -> struct field must be `r#type`.
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: ok }
  /pets:
    get:
      # Hyphenated id -> snake-cased method `list_pets`.
      operationId: list-pets
      responses:
        '200': { description: ok }
  # KNOWN_ISSUES.md C3: query enum values that aren't identifiers.
  /versions:
    get:
      operationId: listVersions
      parameters:
        - name: v
          in: query
          required: true
          schema: { type: string, enum: ["1.0", "2.0", ""] }
      responses:
        '200': { description: ok }
# KNOWN_ISSUES.md C3: enum values and schema names that don't map cleanly to
# Rust identifiers.
components:
  schemas:
    Version:
      type: string
      enum: ["1.0", "2.0", "+1", "", "Self", "self", "404", "super", "crate"]
    Sort:
      type: string
      enum: ["created_at", "createdAt", "-created_at"]
    2FAConfig:
      type: object
      properties:
        enabled: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
    Self:
      type: object
      properties:
        second_factor: { $ref: '#/components/schemas/2FAConfig' }
    type:
      type: string
