# Regression fixture for KNOWN_ISSUES.md S2 (uncommon status codes) and S3
# (optional request bodies).
openapi: 3.0.1
info:
  title: status and body
  version: 0.0.1
paths:
  /partial:
    get:
      operationId: getPartial
      parameters:
        - { name: which, in: query, required: true, schema: { type: integer } }
      responses:
        '206':
          description: partial
          content:
            application/json: { schema: { type: string } }
        '308': { description: permanent redirect }
        '418': { description: teapot }
  /opt:
    post:
      operationId: optBody
      requestBody:
        required: false
        content: { application/json: { schema: { type: integer } } }
      responses:
        '200':
          description: echo
          content:
            application/json: { schema: { type: string } }
  /opt-bin:
    post:
      operationId: optBinBody
      requestBody:
        required: false
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        '200':
          description: echo
          content:
            application/json: { schema: { type: string } }
