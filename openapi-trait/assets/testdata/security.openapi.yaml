openapi: 3.0.1
info:
  title: SecurityExample
  version: 1.0.0
security:
  - apiKeyAuth: []
paths:
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkPayload"
  /admin:
    get:
      operationId: getAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPayload"
  /admin/search:
    get:
      operationId: searchAdmin
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: true, schema: { type: integer } }
      responses:
        "204":
          description: ok
  /flex:
    get:
      operationId: getFlex
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindPayload"
  /public:
    get:
      operationId: getPublic
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkPayload"
  /cookied:
    get:
      operationId: getCookied
      security:
        - sessionCookie: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
  /oauth:
    get:
      operationId: getOauth
      security:
        - oauth: [read:things]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPayload"
  /oidc:
    get:
      operationId: getOidc
      security:
        - oidc: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPayload"
  /maybe:
    get:
      operationId: getMaybe
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindPayload"
  /maybe-flex:
    get:
      operationId: getMaybeFlex
      security:
        - bearerAuth: []
        - basicAuth: []
        - {}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindPayload"
components:
  schemas:
    OkPayload:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    TokenPayload:
      type: object
      properties:
        token:
          type: string
      required: [token]
    KindPayload:
      type: object
      properties:
        kind:
          type: string
      required: [kind]
    SessionPayload:
      type: object
      properties:
        session:
          type: string
      required: [session]
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/token
          scopes:
            read:things: read things
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
