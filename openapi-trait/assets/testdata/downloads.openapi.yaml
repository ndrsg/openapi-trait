openapi: 3.0.0
info:
  title: Downloads API
  version: 1.0.0
paths:
  /files/{id}:
    get:
      operationId: downloadFile
      summary: Download a file by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes
          headers:
            Content-Disposition:
              description: Suggested filename for download
              schema:
                type: string
            ETag:
              description: Entity tag for caching
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: File not found
  /files:
    post:
      operationId: uploadFile
      summary: Upload a file
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
