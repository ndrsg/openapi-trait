# Regression fixture for KNOWN_ISSUES.md C5: type names must not collide.
# Names synthesized for inline schemas get a numeric suffix when a component
# schema already has them; operation types live in their own module, so a
# schema can share their name.
openapi: 3.0.1
info:
  title: name_collisions
  version: 0.0.1
paths:
  /things/{kind}:
    post:
      operationId: createThing
      parameters:
        # `create_thing::KindPath`, next to the `CreateThingKindPath` schema.
        - { name: kind, in: path, required: true, schema: { type: string, enum: [a, b] } }
      requestBody:
        required: true
        content:
          application/json:
            # Named like the operation's request struct.
            schema: { $ref: '#/components/schemas/CreateThingRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              # Named like the response enum inside the operation's module.
              schema: { $ref: '#/components/schemas/Response' }
        '400':
          description: rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
components:
  schemas:
    CreateThingRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Request:
      type: object
      properties:
        reason: { type: string }
    Response:
      type: object
      properties:
        id: { type: integer }
    CreateThingKindPath:
      type: object
      properties:
        w: { type: string }
    # `Person.address` would be named `PersonAddress`, which is taken.
    PersonAddress:
      type: object
      properties:
        x: { type: string }
    Person:
      type: object
      properties:
        address:
          type: object
          properties:
            y: { type: string }
    # The extra entries' inline type would be `BagAdditionalProperties`.
    BagAdditionalProperties:
      type: object
      properties:
        unrelated: { type: boolean }
    Bag:
      type: object
      properties:
        label: { type: string }
      additionalProperties:
        type: object
        properties:
          count: { type: integer }
    # The item enum of an array alias used to be named after the alias itself.
    Colors:
      type: array
      items: { type: string, enum: [red, green] }
