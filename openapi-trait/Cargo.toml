[package]
name = "openapi-trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Generate typed Rust traits from OpenAPI specifications using a proc-macro attribute"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/openapi-trait"

[features]
default = ["reqwest-client"]
reqwest-client = ["dep:reqwest", "dep:percent-encoding", "openapi-trait-client/reqwest-client"]
validation = ["dep:serde_valid", "openapi-trait-axum/validation", "openapi-trait-client/validation"]

[dependencies]
openapi-trait-axum = { path = "../openapi-trait-axum", version = "0.0.8" }
openapi-trait-client = { path = "../openapi-trait-client", version = "0.0.8" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }
base64 = "0.22"
form_urlencoded = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
serde_valid = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
axum = "0.8"
serde = { version = "1", features = ["derive"]}
serde_json = "1"
serde_valid = "2"

[lints]
workspace = true
