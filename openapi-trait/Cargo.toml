[package]
name = "openapi-trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Generate typed Rust traits from OpenAPI specifications using a proc-macro attribute"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/openapi-trait"

[features]
default = ["reqwest-client"]
reqwest-client = ["dep:reqwest", "dep:percent-encoding", "openapi-trait-client/reqwest-client"]

[dependencies]
openapi-trait-axum = { path = "../openapi-trait-axum", version = "0.0.2" }
openapi-trait-client = { path = "../openapi-trait-client", version = "0.0.2" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
axum = "0.8"
serde = { version = "1", features = ["derive"]}
serde_json = "1"

[lints]
workspace = true
