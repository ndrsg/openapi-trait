[package]
name = "openapi-trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Generate typed Rust traits from OpenAPI specifications using a proc-macro attribute"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/openapi-trait"

[dependencies]
openapi-trait-axum = { path = "../openapi-trait-axum", version = "0.0.1" }
openapi-trait-client = { path = "../openapi-trait-client", version = "0.0.1" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
serde = { version = "1", features = ["derive"]}
serde_json = "1"

[lints]
workspace = true
