name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Lint
      run: cargo fmt --check && cargo clippy
    - name: Lint (validation)
      run: cargo clippy --all-targets --features validation
    - name: Build
      run: cargo build --verbose
    - name: Build examples
      run: cargo build --examples --all-features
    - name: Check without default features
      run: cargo check -p openapi-trait --no-default-features
    - name: Docs
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps && cargo doc --workspace --no-deps --features validation
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests (validation)
      run: cargo test --verbose --features validation

  msrv:
    name: Minimum supported Rust version

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # Keep in sync with `rust-version` in Cargo.toml and `msrv` in clippy.toml.
    - uses: dtolnay/rust-toolchain@1.120
    - uses: Swatinem/rust-cache@v2
    # `+1.89` overrides the newer toolchain pinned in rust-toolchain.toml.
    - name: Check
      run: |
        cargo +1.89 check --workspace
        cargo +1.89 check --workspace --features validation
        cargo +1.89 check -p openapi-trait --no-default-features
